name: ninfer

services:
  ninfer-serve:
    image: ghcr.io/a-earthperson/ninfer-v100:v1.0.1
    build:
      context: .
    pull_policy: missing
    restart: unless-stopped
    environment:
      NINFER_MODEL_REPO: neroued/Qwen3.8-27B-nvfp4-NInfer
      NINFER_MODEL_FILE: qwen3_8_27b_nvfp4.ninfer
      HF_TOKEN: ${HF_TOKEN:-}
    command: >-
      ninfer-serve /models/qwen3_8_27b_nvfp4.ninfer
      --host 0.0.0.0
      --port 8080
      --max-context 240000
      --prefill-chunk 2048
      --kv-capacity auto
      --max-concurrency 1
      --kv-dtype int8
      --device-state-slots 1
      --host-state-slots 8
      --host-kv-mib 8192
      --spec mtp --draft-tokens 4
      --lm-head-draft
      --preserve-thinking
      --vision
    ports:
      - "8080:8080"
    volumes:
      - models:/models
      - hf-cache:/var/cache/huggingface
    ulimits:
      memlock: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60m
    stop_grace_period: 60s

volumes:
  models:
  hf-cache:
